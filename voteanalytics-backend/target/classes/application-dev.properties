# Development Profile (Standalone persistence with file storage)
spring.datasource.url=jdbc:h2:file:./data/voteanalytics_dev;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.sql.init.mode=never

app.jwt.secret=9a4f2c8d3b7a1e6f4c8b2d0e5a7f9c1b3d5e7a9c1b3d5e7a9c1b3d5e7a9c1b3d
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173

app.mail.from=noreply@voteanalytics.com
app.frontend.url=http://localhost:5173
